<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Accessible Photo Gallery</title>
	<link rel="stylesheet" href="gallery.css">
	<script src="gallery.js" defer></script>
</head>
<body onload="addTabIndex()">
	
	<div id="image">
		Hover over an image below to display here.
	</div>
	
	<img class="preview" alt="Styling with a Bandana" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/bacon.jpg" 
		 onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
	
	<img class="preview" alt="With My Boy" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/bacon2.JPG" 
		 onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">
	
	<img class="preview" alt="Young Puppy" src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/bacon3.jpg" 
		 onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">

	<img class="preview" alt="Dog Playing in Snow" src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=500" 
		 onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">

	<img class="preview" alt="Cute Golden Retriever" src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=500" 
		 onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">

	<img class="preview" alt="Sleepy Puppy Resting" src="https://images.unsplash.com/photo-1537151608828-ea2b11777ee8?w=500" 
		 onmouseover="upDate(this)" onmouseleave="unDo()" onfocus="upDate(this)" onblur="unDo()">

</body>
</html>
